<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./shopping-cart.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <!--**************** NAVBAR **********************-->
    <nav class="navbar md:navbar-expand bg-1" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Dark navbar</a>
        <button
          class="btn-icon navbar-toggler"
          type="button"
          data-bs-toggle="drawer"
          data-bs-target="#navbarDarkDrawer"
          aria-controls="navbarDarkDrawer"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <dialog
          class="drawer drawer-end"
          tabindex="-1"
          id="navbarDarkDrawer"
          aria-labelledby="navbarDarkDrawerLabel"
        >
          <div class="drawer-header">
            <h5 class="drawer-title" id="navbarDarkDrawerLabel">Menu</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="drawer"
              aria-label="Close"
            ></button>
          </div>
          <div class="drawer-body mb-2 md:mb-0">
            <ul class="nav navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Link</a>
              </li>
              <li class="nav-item">
                <button
                  class="nav-link"
                  type="button"
                  data-bs-toggle="menu"
                  aria-expanded="false"
                >
                  Menu
                </button>
                <div class="menu">
                  <a class="menu-item" href="#">Action</a>
                  <a class="menu-item" href="#">Another action</a>
                  <hr class="menu-divider" />
                  <a class="menu-item" href="#">Something else here</a>
                </div>
              </li>
              <li class="nav-item">
                <a class="nav-link disabled" aria-disabled="true">Disabled</a>
              </li>
            </ul>
            <form class="hstack gap-2" role="search">
              <input
                class="form-control"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn-solid btn-icon theme-secondary" type="submit">
                <i
                  class="fa-solid fa-magnifying-glass"
                  style="color: rgb(203, 203, 203)"
                ></i>
              </button>
            </form>
          </div>
        </dialog>
      </div>
    </nav>
    <!--**************** TOTAL PRICE **********************-->
    <h1 class="text-center my-2">
      Total Price: <span id="total-price">0</span> DT
    </h1>
    <!--**************** CARDS **********************-->
    <div
      class="container d-flex flex-wrap justify-content-center gap-5 align-items-center"
    >
      <!-- ****** CARD 1 ******-->
      <section class="card" style="max-width: 320px">
        <img
          style="height: 300px; object-fit: cover"
          src="https://static.fendi.com/dam/is/image/fendi/FY1319AY0GF0QA1_01?wid=1000&hei=1000&hash=43da182b53e00696395ae024b530d148-19c752daa86"
          class="card-img-top"
          alt="..."
        />
        <div class="card-body">
          <h4 class="card-title">T-shist</h4>
          <p class="card-text">Fendi</p>
          <p>Price: <span class="unit-price">100</span> DT</p>
          <div class="d-flex justify-content-center align-items-center gap-5">
            <i class="fa-solid fa-circle-minus fa-xl"></i>
            <h2 class="quantity">0</h2>
            <i class="fa-solid fa-circle-plus fa-xl"></i>
          </div>
          <div class="d-flex align-items-center justify-content-between my-4">
            <i class="fa-solid fa-trash-can fa-2xl"></i>
            <i class="fa-solid fa-heart fa-2xl"></i>
          </div>
        </div>
      </section>
      <!-- ****** CARD 2 ******-->
      <section class="card" style="max-width: 320px">
        <img
          style="height: 300px; object-fit: cover"
          src="https://nb.scene7.com/is/image/NB/ukls3qz_nb_05_i?$pdpflexf2$&qlt=80&fmt=webp&wid=440&hei=440"
          class="card-img-top"
          alt="..."
        />
        <div class="card-body">
          <h4 class="card-title">Shoes</h4>
          <p class="card-text">newbalance</p>
          <p>Price: <span class="unit-price">150</span> DT</p>
          <div class="d-flex justify-content-center align-items-center gap-5">
            <i class="fa-solid fa-circle-minus fa-xl"></i>
            <h2 class="quantity">0</h2>
            <i class="fa-solid fa-circle-plus fa-xl"></i>
          </div>
          <div class="d-flex align-items-center justify-content-between my-4">
            <i class="fa-solid fa-trash-can fa-2xl"></i>
            <i class="fa-solid fa-heart fa-2xl"></i>
          </div>
        </div>
      </section>
      <!-- ****** CARD 3 ******-->
      <section class="card" style="max-width: 320px">
        <img
          style="height: 300px; width: 300px; object-fit: cover"
          src="https://static.zara.net/assets/public/b26d/ade4/ae924770aa08/502bc4d1ccf0/06164161427-p/06164161427-p.jpg?ts=1794575538592&w=750"
          class="card-img-top"
          alt="..."
        />
        <div class="card-body">
          <h4 class="card-title">Jeans</h4>
          <p class="card-text">Zara</p>
          <p>Price: <span class="unit-price">200</span> DT</p>
          <div class="d-flex justify-content-center align-items-center gap-5">
            <i class="fa-solid fa-circle-minus fa-xl"></i>
            <h2 class="quantity">0</h2>
            <i class="fa-solid fa-circle-plus fa-xl"></i>
          </div>
          <div class="d-flex align-items-center justify-content-between my-4">
            <i class="fa-solid fa-trash-can fa-2xl"></i>
            <i class="fa-solid fa-heart fa-2xl"></i>
          </div>
        </div>
      </section>
      <!-- ****** CARD 4 ******-->
        <section class="card" style="max-width: 320px">
        <img
          style="height: 300px; width: 300px; object-fit: cover"
          src="https://n.nordstrommedia.com/it/d9fb54f6-7003-48f5-a35a-f021c917c87f.jpeg?w=780&h=1170&crop=pad&dpr=2"
          class="card-img-top"
          alt="..."
        />
        <div class="card-body">
          <h4 class="card-title">Blazers</h4>
          <p class="card-text">Lauren Ralph Lauren</p>
          <p>Price: <span class="unit-price">600</span> DT</p>
          <div class="d-flex justify-content-center align-items-center gap-5">
            <i class="fa-solid fa-circle-minus fa-xl"></i>
            <h2 class="quantity">0</h2>
            <i class="fa-solid fa-circle-plus fa-xl"></i>
          </div>
          <div class="d-flex align-items-center justify-content-between my-4">
            <i class="fa-solid fa-trash-can fa-2xl"></i>
            <i class="fa-solid fa-heart fa-2xl"></i>
          </div>
        </div>
      </section>
    </div>
    <script
      src="https://kit.fontawesome.com/d2967e71b9.js"
      crossorigin="anonymous"
    ></script>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"
    ></script>
    <script src="./shopping-cart.js"></script>
  </body>
</html>
